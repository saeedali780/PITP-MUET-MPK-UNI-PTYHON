<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Post</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Flask Blog</a>
            <a class="btn btn-light btn-sm" href="/">← Back to Home</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body">
                <h3 class="text-center text-primary mb-4">📝 Add a New Post</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Post Title</label>
                        <input type="text" name="title" class="form-control" placeholder="Enter title..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Content</label>
                        <textarea name="content" rows="5" class="form-control" placeholder="Write your blog content..." required></textarea>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">Publish Post</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 bg-white mt-5 border-top">
        <small>&copy; {{ 2025 }} Flask Blog by Saeed Ali 😎</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
