<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask Blog - Home</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Ensure footer stays at bottom */
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }
        main {
            flex: 1; /* Takes remaining space */
        }
        footer {
            background: white;
            border-top: 1px solid #dee2e6;
            text-align: center;
            padding: 10px 0;
            margin-top: auto; /* Pushes footer to bottom */
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Flask Blog</a>
            <a class="btn btn-light btn-sm" href="/add">+ Add New Post</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">
        <h2 class="text-center mb-4">📝 Recent Blog Posts</h2>

        {% if posts %}
            <div class="row">
                {% for post in posts %}
                    <div class="col-md-6 mb-4">
                        <div class="card shadow-sm h-100">
                            <div class="card-body">
                                <h5 class="card-title text-primary">{{ post.title }}</h5>
                                <p class="card-text">{{ post.content }}</p>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="alert alert-info text-center">
                No posts yet! Click "Add New Post" to create one.
            </div>
        {% endif %}
    </main>

    <!-- Footer (Always Bottom) -->
    <footer>
        <small>&copy; 2025 Flask Blog by Saeed Ali 😎</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
